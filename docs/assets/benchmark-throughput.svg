<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 310" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-tp-0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89dceb" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <linearGradient id="grad-tp-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <linearGradient id="grad-tp-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fab387" />
      <stop offset="100%" stop-color="#f9e2af" />
    </linearGradient>
    <linearGradient id="grad-tp-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#b4befe" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="500" height="310" rx="10" fill="#181825" stroke="#313244" stroke-width="1" />

  <!-- Header -->
  <text x="24" y="34" fill="#cdd6f4" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Memory Transfer Throughput Scaling</text>
  <text x="24" y="52" fill="#a6adc8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Bandwidth scaling across payload sizes (MB/s &bull; Higher is better)</text>
  
  <!-- Pill badge -->
  <rect x="382" y="20" width="94" height="20" rx="10" fill="#313244" />
  <text x="429" y="34" fill="#89dceb" font-size="10" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">N = 30 Samples</text>

  <!-- Grid line -->
  <line x1="24" y1="68" x2="476" y2="68" stroke="#313244" stroke-width="1" />

  
      <!-- Row 1: 64 B -->
      <text x="75" y="107" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">64 B</text>
      <rect x="85" y="85" width="280" height="32" rx="6" fill="#11111b" />
