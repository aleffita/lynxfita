name: LynxFita CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-validation:
    name: TypeScript & Package Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Workspace Module Proxies
        run: node --experimental-strip-types scripts/setup-workspace.ts

      - name: Verify Anti-Slop & Documentation Gates
        run: pnpm run verify:docs

      - name: Build All Monorepo Packages
        run: pnpm -r run build

      - name: Install Playwright Chromium & FFmpeg for E2E Browser Tests
        run: pnpm exec playwright-core install chromium ffmpeg

      - name: Run Workspace Tests
        run: pnpm test

      - name: Run Statistical Benchmarks
        run: pnpm run bench

      - name: Verify Vendor Submodules
        run: node --experimental-strip-types scripts/vendor-sync.ts --verify

  native-windows:
    name: Native C++20 (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build/native -S src/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Native C++
        run: cmake --build build/native --config Release

      - name: Run Native Unit Tests
        run: build\native\lynxfita_native_tests.exe

      - name: Verify Standalone lynxfita_explorer Navigation Lifecycle
        run: build\native\lynxfita_explorer.exe --verify-navigation

  native-posix:
    name: Native C++20 (Linux GCC/Clang POSIX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure CMake
        run: cmake -B build/native -S src/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Native C++
        run: cmake --build build/native

      - name: Run Native Unit Tests
        run: ./build/native/lynxfita_native_tests

      - name: Verify Standalone lynxfita_explorer Navigation Lifecycle
        run: ./build/native/lynxfita_explorer --verify-navigation

      - name: Setup Node.js (POSIX Validation)
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Workspace Module Proxies
        run: node --experimental-strip-types scripts/setup-workspace.ts

      - name: Build All Monorepo Packages
        run: pnpm -r run build

      - name: Run Cross-Platform Node Unit & Integration Tests (POSIX)
        run: pnpm run test:unit && pnpm run test:integration
