      <text x="107" y="106" fill="#cdd6f4" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">88.5 MB/s</text>
      <text x="475" y="106" fill="#6c7086" font-size="11" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1×</text>
    
      <!-- Row 2: 4 KB -->
      <text x="75" y="159" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">4 KB</text>
      <rect x="85" y="137" width="280" height="32" rx="6" fill="#11111b" />
      <rect x="85" y="137" width="38" height="32" rx="6" fill="url(#grad-tp-1)" />
      <text x="133" y="158" fill="#cdd6f4" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">6,135 MB/s</text>
      <text x="475" y="158" fill="#6c7086" font-size="11" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">69×</text>
    
      <!-- Row 3: 64 KB -->
      <text x="75" y="211" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">64 KB</text>
      <rect x="85" y="189" width="280" height="32" rx="6" fill="#11111b" />
      <rect x="85" y="189" width="243" height="32" rx="6" fill="url(#grad-tp-2)" />
      <text x="338" y="210" fill="#cdd6f4" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">38,981 MB/s</text>
      <text x="475" y="210" fill="#6c7086" font-size="11" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">441×</text>
    
      <!-- Row 4: 1 MB -->
      <text x="75" y="263" fill="#cdd6f4" font-size="12" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">1 MB</text>
      <rect x="85" y="241" width="280" height="32" rx="6" fill="#11111b" />
      <rect x="85" y="241" width="264" height="32" rx="6" fill="url(#grad-tp-3)" />
      <text x="359" y="262" fill="#cdd6f4" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">42,499 MB/s</text>
      <text x="475" y="262" fill="#6c7086" font-size="11" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">480×</text>
    

  <!-- Footer Info -->
  <line x1="24" y1="284" x2="476" y2="284" stroke="#313244" stroke-width="1" />
  <text x="24" y="299" fill="#6c7086" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">In-memory stationary buffer transfer (Node.js v26 / AMD Ryzen 5 4500)</text>
  <text x="476" y="299" fill="#6c7086" font-size="10" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Speedup vs 64B</text>
