name: LynxFita CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-validation:
    name: TypeScript & Package Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Workspace Module Proxies
        run: node scripts/setup-workspace.mjs

      - name: Build Core Runtime Package
        run: pnpm --filter "@lynxfita/core" run build

      - name: Build TypeScript Packages
        run: pnpm --filter "./packages/*" run build

      - name: Build Example Packages
        run: pnpm --filter "./examples/*" run build

      - name: Run Package Tests
        run: pnpm -r run test

      - name: Verify Vendor Submodules
        run: node scripts/vendor-sync.mjs --verify

  native-windows:
    name: Native C++20 (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build/native -S src/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Native C++
        run: cmake --build build/native --config Release

      - name: Run Native Unit Tests
        run: build\native\lynxfita_native_tests.exe

  native-posix:
    name: Native C++20 (Linux GCC/Clang POSIX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential

      - name: Configure CMake
        run: cmake -B build/native -S src/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Native C++
        run: cmake --build build/native

      - name: Run Native Unit Tests
        run: ./build/native/lynxfita_native_tests
