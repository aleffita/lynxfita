name: LynxFita Release & Distribution

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-release-artifacts:
    name: Build & Package Release Artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Workspace Module Proxies
        run: node scripts/setup-workspace.mjs

      - name: Build Core Runtime Package
        run: pnpm --filter "@lynxfita/core" run build

      - name: Build TypeScript Packages
        run: pnpm --filter "./packages/*" run build

      - name: Build Example Packages
        run: pnpm --filter "./examples/*" run build

      - name: Run Tests
        run: pnpm -r run test

      - name: Configure CMake Native
        run: cmake -B build/native -S src/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Native Release Binary
        run: cmake --build build/native --config Release

      - name: Run Native Tests
        run: build\native\lynxfita_native_tests.exe

      - name: Package Release Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/staging -Force
          New-Item -ItemType Directory -Path dist/release -Force
          Copy-Item -Path build/native/lynxfita_native.lib -Destination dist/staging/
          Copy-Item -Path build/native/lynxfita_native_tests.exe -Destination dist/staging/
          Compress-Archive -Path src/native/include/* -DestinationPath dist/release/lynxfita-native-headers.zip
          Compress-Archive -Path dist/staging/* -DestinationPath dist/release/lynxfita-windows-x64-${{ github.ref_name }}.zip
          Get-FileHash -Algorithm SHA256 dist/release/*.zip | Out-File dist/release/checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.zip
            dist/release/checksums.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-container-package:
    name: Build & Push GHCR Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push Docker image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          VERSION=${{ github.ref_name }}
          echo "Building and pushing $IMAGE_ID:$VERSION and $IMAGE_ID:latest"
          docker build . -t $IMAGE_ID:$VERSION -t $IMAGE_ID:latest
          docker push $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:latest

