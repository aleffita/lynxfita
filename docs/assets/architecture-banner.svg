<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#1a1c26"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9d65d"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e202e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#141520" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#27293d" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
  </g>

  <!-- Header Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">LynxFita <tspan fill="url(#accentGrad)">v2.0.0 Architecture</tspan></text>
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9ca3af">State-of-the-Art Desktop &amp; Embedded Runtime for LynxJS | Static Hermes (static_h) | Cell EIB DMA | CORDIS</text>

  <!-- Layer 1: Application & Mini-App Space -->
  <rect x="50" y="115" width="340" height="265" rx="12" fill="url(#cardGrad)" stroke="#f9d65d" stroke-width="1.5"/>
  <rect x="50" y="115" width="340" height="34" rx="12" fill="#f9d65d" fill-opacity="0.15"/>
  <text x="70" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f9d65d">1. APPLICATION &amp; MVI MODULES</text>
  
  <rect x="70" y="165" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="85" y="190" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">Weather Showcase MVI (Port)</text>
  <text x="290" y="190" font-family="monospace" font-size="11" fill="#f9d65d">#f9d65d</text>

  <rect x="70" y="215" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="85" y="240" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">Super-App Module Federation</text>

  <rect x="70" y="265" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="85" y="290" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">WebGPU / WGSL Compute Shaders</text>

  <rect x="70" y="315" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="85" y="340" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">CORDIS Spatiotemporal Ledger</text>

  <!-- Connecting Bus 1 -->
  <path d="M 390 247 L 430 247" stroke="#f9d65d" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="432,247 424,242 424,252" fill="#f9d65d"/>

  <!-- Layer 2: Native C++20 JSI Host Engine -->
  <rect x="430" y="115" width="340" height="265" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="430" y="115" width="340" height="34" rx="12" fill="#38bdf8" fill-opacity="0.15"/>
  <text x="450" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">2. C++20 JSI NATIVE CORE</text>

  <rect x="450" y="165" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="465" y="190" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">Static Hermes AOT (static_h)</text>

  <rect x="450" y="215" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="465" y="240" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">DmaEibEngine (64B Cache Aligned)</text>

  <rect x="450" y="265" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="465" y="290" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">Non-Colored Coroutines (Zero GIL)</text>

  <rect x="450" y="315" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="465" y="340" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">Protobuf Binary Wire Interceptor</text>

  <!-- Connecting Bus 2 -->
  <path d="M 770 247 L 810 247" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="812,247 804,242 804,252" fill="#38bdf8"/>

  <!-- Layer 3: Distribution & Hardware Layer -->
  <rect x="810" y="115" width="340" height="265" rx="12" fill="url(#cardGrad)" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="810" y="115" width="340" height="34" rx="12" fill="#4ade80" fill-opacity="0.15"/>
  <text x="830" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#4ade80">3. MULTI-PLATFORM &amp; OTA</text>

  <rect x="830" y="165" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="845" y="190" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">lynxfita_explorer (Win/Linux/Mac)</text>

  <rect x="830" y="215" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="845" y="240" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">GitHub Releases (Native Binaries)</text>

  <rect x="830" y="265" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="845" y="290" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">GitHub Packages (@aleffita/*)</text>

  <rect x="830" y="315" width="300" height="42" rx="6" fill="#141520" stroke="#3b3d54" stroke-width="1"/>
  <text x="845" y="340" font-family="monospace" font-size="12" font-weight="600" fill="#f3f4f6">OTA AOT Bundles + Ed25519 RBAC</text>

</svg>
