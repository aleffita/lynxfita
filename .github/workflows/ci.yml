name: LynxFita CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ts-validation:
    name: TypeScript & Package Checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Package Tests
        run: pnpm test

      - name: Verify Vendor Submodules
        run: node scripts/vendor-sync.mjs --verify

  native-build:
    name: Native C++ & CMake Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure CMake
        run: cmake -B build/native -S src/native -G "Visual Studio 17 2022" -A x64

      - name: Build Native C++
        run: cmake --build build/native --config Release

      - name: Run Native Unit Tests
        run: ctest --test-dir build/native -C Release --output-on-failure
