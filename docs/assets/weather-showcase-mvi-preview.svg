<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="panelDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="panelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f9d65d"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="1000" height="520" rx="16" fill="#0d0e15" stroke="#232636" stroke-width="2"/>

  <!-- Title & Legend -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Weather Showcase <tspan fill="#f9d65d">MVI Industrial Port</tspan></text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">Parity with aleffita/weather-showcase design | Unidirectional Intents | Stationary DMA Lane [0x2000] | WebGPU WGSL</text>

  <!-- Left: Dark Theme Phone Mockup (#000000) -->
  <g transform="translate(60, 95)">
    <!-- Device Frame -->
    <rect width="400" height="390" rx="20" fill="url(#panelDark)" stroke="#27272a" stroke-width="2"/>
    
    <!-- Top Pill: Theme & Status -->
    <rect x="25" y="20" width="80" height="24" rx="12" fill="#27272a"/>
    <text x="40" y="36" font-family="monospace" font-size="11" font-weight="700" fill="#f9d65d">DARK</text>

    <!-- Time & Location -->
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#a1a1aa">Qua, 4 de Nov • 18:28</text>
    <text x="25" y="105" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">São Paulo, <tspan fill="#71717a">BR</tspan></text>

    <!-- Main Weather Display -->
    <g transform="translate(25, 125)">
      <!-- Sun Icon -->
      <circle cx="45" cy="45" r="28" fill="url(#sunGrad)"/>
      <g stroke="#f9d65d" stroke-width="3" stroke-linecap="round">
        <line x1="45" y1="5" x2="45" y2="12"/>
        <line x1="45" y1="78" x2="45" y2="85"/>
        <line x1="5" y1="45" x2="12" y2="45"/>
        <line x1="78" y1="45" x2="85" y2="45"/>
        <line x1="17" y1="17" x2="22" y2="22"/>
        <line x1="68" y1="68" x2="73" y2="73"/>
        <line x1="17" y1="73" x2="22" y2="68"/>
        <line x1="68" y1="22" x2="73" y2="17"/>
      </g>
      <!-- Temperature -->
      <text x="110" y="65" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff">24<tspan font-size="36" fill="#f9d65d">°C</tspan></text>
      <text x="115" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#a1a1aa">Clear Sky (01d)</text>
    </g>

    <!-- Hourly Forecast (3h, 6h, 12h) -->
    <g transform="translate(25, 235)">
      <rect x="0" y="0" width="105" height="65" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">09:00 PM</text>
      <text x="15" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#f9d65d">🌤️ 22°</text>

      <rect x="120" y="0" width="105" height="65" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="135" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">12:00 AM</text>
      <text x="135" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#f9d65d">☁️ 20°</text>

      <rect x="240" y="0" width="105" height="65" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="255" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">06:00 AM</text>
      <text x="255" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#f9d65d">🌙 18°</text>
    </g>

    <!-- DMA Telemetry Badge -->
    <rect x="25" y="320" width="350" height="45" rx="8" fill="#18181b" stroke="#f9d65d" stroke-width="1"/>
    <text x="38" y="340" font-family="monospace" font-size="10.5" font-weight="700" fill="#f9d65d">DMA LANE [0x2000]:</text>
    <text x="38" y="356" font-family="monospace" font-size="10.5" fill="#e4e4e7">[24.5, 65.0, 1013.25, 12.0] (4-float SIMD)</text>
  </g>

  <!-- Right: Light Theme Phone Mockup (#ffffff) -->
  <g transform="translate(540, 95)">
    <!-- Device Frame -->
    <rect width="400" height="390" rx="20" fill="url(#panelLight)" stroke="#e4e4e7" stroke-width="2"/>
    
    <!-- Top Pill: Theme & Status -->
    <rect x="25" y="20" width="80" height="24" rx="12" fill="#e4e4e7"/>
    <text x="38" y="36" font-family="monospace" font-size="11" font-weight="700" fill="#383838">LIGHT</text>

    <!-- Time & Location -->
    <text x="25" y="75" font-family="-apple-system, sans-serif" font-size="13" fill="#71717a">Qua, 4 de Nov • 18:28</text>
    <text x="25" y="105" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#18181b">Rio de Janeiro, <tspan fill="#a1a1aa">BR</tspan></text>

    <!-- Main Weather Display -->
    <g transform="translate(25, 125)">
      <!-- Sun Icon -->
      <circle cx="45" cy="45" r="28" fill="url(#sunGrad)"/>
      <g stroke="#ca8a04" stroke-width="3" stroke-linecap="round">
        <line x1="45" y1="5" x2="45" y2="12"/>
        <line x1="45" y1="78" x2="45" y2="85"/>
        <line x1="5" y1="45" x2="12" y2="45"/>
        <line x1="78" y1="45" x2="85" y2="45"/>
      </g>
      <!-- Temperature -->
      <text x="110" y="65" font-family="-apple-system, sans-serif" font-size="64" font-weight="900" fill="#18181b">28<tspan font-size="36" fill="#eab308">°C</tspan></text>
      <text x="115" y="88" font-family="-apple-system, sans-serif" font-size="14" fill="#71717a">Clear Sky (01d)</text>
    </g>

    <!-- Hourly Forecast (3h, 6h, 12h) -->
    <g transform="translate(25, 235)">
      <rect x="0" y="0" width="105" height="65" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="15" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">09:00 PM</text>
      <text x="15" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#eab308">🌤️ 26°</text>

      <rect x="120" y="0" width="105" height="65" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="135" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">12:00 AM</text>
      <text x="135" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#eab308">☁️ 24°</text>

      <rect x="240" y="0" width="105" height="65" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="255" y="22" font-family="-apple-system, sans-serif" font-size="11" fill="#71717a">06:00 AM</text>
      <text x="255" y="44" font-family="-apple-system, sans-serif" font-size="16" fill="#eab308">🌙 22°</text>
    </g>

    <!-- WebGPU / WGSL Badge -->
    <rect x="25" y="320" width="350" height="45" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="38" y="340" font-family="monospace" font-size="10.5" font-weight="700" fill="#2563eb">WEBGPU WGSL PIPELINE:</text>
    <text x="38" y="356" font-family="monospace" font-size="10.5" fill="#475569">@compute @workgroup_size(64) [Particles: OK]</text>
  </g>
</svg>
